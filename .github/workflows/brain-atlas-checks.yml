name: Brain Atlas checks

on:
  push:
    branches:
      - feat/brain-atlas
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
          for file in tests/*.js; do node --check "$file"; done
      - name: Run tests
        run: node --test tests/*.test.js
