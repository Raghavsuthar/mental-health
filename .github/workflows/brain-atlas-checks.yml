name: Brain Atlas checks

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
          for file in tests/*.js tests/*.cjs; do
            if [ -f "$file" ]; then node --check "$file"; fi
          done
      - name: Run tests
        run: node --test tests/*.test.*
